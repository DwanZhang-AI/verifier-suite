<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="verifier-suite: who verifies the verifiers?">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1A2E"/>
      <stop offset="1" stop-color="#12304F"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="22" fill="url(#grid)"/>

  <!-- left: name and tagline -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="64" y="92" fill="#5FD0C1" font-size="17" font-weight="700" letter-spacing="3.2">VERIFIERBENCH  ×  GAVEL</text>
    <text x="62" y="170" fill="#FFFFFF" font-size="74" font-weight="800" letter-spacing="-1">verifier-suite</text>
    <text x="64" y="226" fill="#DCE6F2" font-size="33" font-weight="600">Who verifies the verifiers?</text>
    <text x="64" y="272" fill="#93A8C2" font-size="20">Measure agent-written verifiers. Build them from evidence.</text>
  </g>

  <!-- right: reference vs generated verdicts -->
  <g transform="translate(770 70)">
    <rect width="450" height="222" rx="14" fill="#0A1626" stroke="#2A4466" stroke-width="1.5"/>
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7F96B2" letter-spacing="1">
      <text x="22" y="34">CASE</text>
      <text x="246" y="34">REFERENCE</text>
      <text x="350" y="34">GENERATED</text>
    </g>
    <line x1="18" y1="48" x2="432" y2="48" stroke="#2A4466" stroke-width="1"/>
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#DCE6F2">
      <text x="22" y="82">Valid reference</text>
      <text x="22" y="124">Valid alternative</text>
      <text x="22" y="166">Partial solution</text>
      <text x="22" y="208">Near miss</text>
    </g>
    <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" text-anchor="middle">
      <!-- reference column -->
      <rect x="246" y="62" width="74" height="28" rx="6" fill="#16776F"/><text x="283" y="81" fill="#FFFFFF">PASS</text>
      <rect x="246" y="104" width="74" height="28" rx="6" fill="#16776F"/><text x="283" y="123" fill="#FFFFFF">PASS</text>
      <rect x="246" y="146" width="74" height="28" rx="6" fill="#33475F"/><text x="283" y="165" fill="#FFFFFF">FAIL</text>
      <rect x="246" y="188" width="74" height="28" rx="6" fill="#33475F"/><text x="283" y="207" fill="#FFFFFF">FAIL</text>
      <!-- generated column -->
      <rect x="352" y="62" width="74" height="28" rx="6" fill="#16776F"/><text x="389" y="81" fill="#FFFFFF">PASS</text>
      <rect x="352" y="104" width="74" height="28" rx="6" fill="#B64342"/><text x="389" y="123" fill="#FFFFFF">FAIL</text>
      <rect x="352" y="146" width="74" height="28" rx="6" fill="#33475F"/><text x="389" y="165" fill="#FFFFFF">FAIL</text>
      <rect x="352" y="188" width="74" height="28" rx="6" fill="#B64342"/><text x="389" y="207" fill="#FFFFFF">PASS</text>
    </g>
  </g>
  <text x="995" y="324" text-anchor="middle" fill="#93A8C2" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15">Red: the generated verifier disagrees with the reference.</text>
</svg>
