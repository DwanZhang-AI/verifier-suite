# Behaviour differences between gavel-harness and the original harness it was
# ported from. Paths under "upstream" are relative to the original harness root;
# UPSTREAM.lock records which of its files this repository carries.
#
# Each [[deviation]] has:
#   id, title
#   category   infra-only             changes how a run is hosted or recorded; the
#                                     prompt, the probe verdict and the anchor
#                                     verdicts stay the same
#              affects-generation     can change what the generating agent sees
#                                     or produces
#              affects-anchor-labels  can change a null, oracle or swap verdict
#              affects-intake         changes which tasks or runs are accepted;
#                                     accepted tasks are packaged as upstream
#   upstream   what the original harness did, with its source
#   shipped    what this repository does
#   reason     why
#   profile_keys   (optional) profile values that differ from the upstream setting
#   package_files  (optional) files of a package built with one prompt switch
#                  flipped that differ from the package built with the default
#                  switches beyond the prompt, with its sha256

schema = "gavel-harness/deviations/1"

[[deviation]]
id = "D01"
title = "Package-source mirror rewrite off by default"
category = "infra-only"
upstream = """judge/adapters/tb4.py, judge/adapters/harbor_generic.py and \
judge/adapters/tbsci.py inserted a block that points apt (and, for tbsci, pip \
and Hugging Face) at mainland-China mirrors into every generation Dockerfile: \
after the first FROM (tb4, harbor_generic) or after the final FROM (tbsci)."""
shipped = """Every benchmark profile sets env = "plain", which inserts nothing. The \
upstream blocks ship byte for byte in the cn-mirror environment profile; \
`--env cn-mirror` reproduces the upstream packages."""
reason = """The mirrors serve hosts in mainland China and slow down or break image \
builds elsewhere. The rewrite changes where the generation image fetches \
packages, not which packages the task's Dockerfile installs. Its effect on \
anchor images is D02 and D03."""
profile_keys = [
    { profile = "gdpval", key = "env", upstream = "cn-mirror", shipped = "plain" },
    { profile = "paper/generic", key = "env", upstream = "cn-mirror", shipped = "plain" },
    { profile = "paper/tb4", key = "env", upstream = "cn-mirror", shipped = "plain" },
    { profile = "paper/tbsci", key = "env", upstream = "cn-mirror", shipped = "plain" },
]

[[deviation]]
id = "D02"
title = "TB4 anchor image is built with the run's environment profile"
category = "affects-anchor-labels"
upstream = """The original harness's TB4 verdict gate built the judge image from the \
environment of the packaged task, whose Dockerfile carries the mirror rewrite after \
the first FROM, and ran the verifier in it with the network on."""
shipped = """paper/tb4 [anchor] image = "packaged": the environment of the run's own \
generation package, built with the run's environment profile (default plain, \
no rewrite). With `--env cn-mirror` the environment equals the gate's."""
reason = """Follows from D01. A rebuilt image can resolve different package \
versions, and a verifier that installs packages while judging (network on) \
reaches different package sources."""
profile_keys = [
    { profile = "paper/tb4", key = "env", upstream = "cn-mirror", shipped = "plain" },
]

[[deviation]]
id = "D03"
title = "TB-Science anchor image is the task's environment without the gate's mirror"
category = "affects-anchor-labels"
upstream = """The original harness's TB-Science verdict gate built the judge image \
from the task's own environment with its mirror block inserted after the final FROM."""
shipped = """paper/tbsci [anchor] image = "original": the input task's own \
environment, which no environment profile rewrites."""
reason = """An anchor judges the environment the task defines. The gate ran \
offline, so the rewrite only changed where the image build fetched packages; \
a rebuilt image can still resolve different versions."""

[[deviation]]
id = "D04"
title = "GDPval anchors run offline"
category = "affects-anchor-labels"
upstream = """The original harness's validation step, which validated the GDPval \
verifiers, started each container with `docker run` and no --network flag (docker's \
default bridge, network on) and capped each verifier run at --timeout 2400."""
shipped = """gdpval [anchor] network = "no-network" (Harbor's verifier \
network_mode); image, user, working directory and the 2400 s cap are unchanged."""
reason = """Owner decision: the verification phase runs offline, so a verdict \
cannot depend on remote state. Harbor's per-phase network policy was checked to \
give the agent phase network and the verifier phase none. A verifier that \
fetches anything while judging gets a different verdict, so the validation \
step's anchor labels are not comparable with these."""
profile_keys = [
    { profile = "gdpval", key = "anchor.network", upstream = "public", shipped = "no-network" },
]

[[deviation]]
id = "D05"
title = "Generic-profile anchors run offline with an 1800 s cap"
category = "affects-anchor-labels"
upstream = """The original harness's validation step for harbor_generic packages: \
network on, --timeout 2400."""
shipped = """paper/generic [anchor] network = "no-network", timeout_sec = 1800."""
reason = """Offline: the owner decision of D04. 1800 s is the TB4 verdict gate's \
cap, taken because the profile packages tasks as the TB4 adapter did; no \
measurement chose it over the validation step's 2400 s."""
profile_keys = [
    { profile = "paper/generic", key = "anchor.network", upstream = "public", shipped = "no-network" },
    { profile = "paper/generic", key = "anchor.timeout_sec", upstream = 2400.0, shipped = 1800.0 },
]

[[deviation]]
id = "D06"
title = "Declare mode captures the declaration in tests/test.sh"
category = "infra-only"
upstream = """With VERITAS_DECLARE=1 the tb4 and harbor_generic adapters changed only \
the prompt; tests/test.sh stayed the probe, so no declaration came back through \
the verifier channel. The upstream capture helper, add_evidence_capture() in \
judge/core/task_transform.py, inserts the block after `mkdir -p "$V"` or else \
appends it. For this probe (V=/app/verifier.sh, no such line) it would land \
after the probe's early `exit 0` and write to /app/verifier.sh/evidence."""
shipped = """The deliverable paradigm's declare mode runs the upstream block \
(EVIDENCE_CAPTURE_SH, extracted byte for byte into \
paradigms/assets/evidence_capture.sh) in a subshell with V=/logs/verifier, \
right after the probe's `mkdir -p "$REWARD_DIR"`. gen_declaration.json and \
material_TASK.md reach /logs/verifier/evidence on every probe path."""
reason = """The certificate needs the declaration and the task material. The block only writes files; the probe's output and reward are \
unchanged."""
package_files = [
    { paradigm = "deliverable", switch = "declare", path = "tests/test.sh", sha256 = "c77daeafb8fe7e2aa1dc50c38a9da11de4073e30c3ef910c87dc33b3d5a8a762" },
]

[[deviation]]
id = "D07"
title = "Declare mode: 600 s probe budget and the declaration as an artifact"
category = "infra-only"
upstream = """A declare-mode package kept the task.toml template unchanged: \
[verifier] timeout_sec = 300.0 and artifacts = ["/app/verifier.sh"]."""
shipped = """Profiles with a [declare] table (gdpval, paper/generic) set the \
declare-mode probe budget to 600 s, and the deliverable paradigm adds \
/app/declaration.json to artifacts."""
reason = """The capture block of D06 has 330 s of capped steps, more than 300 s; \
the probe verdict itself is a bash syntax check. The trial downloads the \
declaration next to the verifier it describes, independent of the capture."""
profile_keys = [
    { profile = "gdpval", key = "declare.verifier_timeout_sec", upstream = 300.0, shipped = 600.0 },
    { profile = "paper/generic", key = "declare.verifier_timeout_sec", upstream = 300.0, shipped = 600.0 },
]
package_files = [
    { paradigm = "deliverable", switch = "declare", path = "task.toml", sha256 = "74a9a663297c95cb1eabcdc8602001299efbf3118601b893fe3f9a54b99dd38f" },
]

[[deviation]]
id = "D08"
title = "Declare mode only where the declaration comes back"
category = "affects-intake"
upstream = """VERITAS_DECLARE=1 appended the declaration directive for every adapter, \
including tb4 and tbsci, without bringing the declaration back (see D06)."""
shipped = """The package builder refuses declare mode in the terminal_state paradigm and for \
profiles without a [declare] table (paper/tb4, paper/tbsci). `gavel-harness gen` and `gavel-harness matrix` \
refuse --declare altogether in this build, before anything is written: the declaration and its \
certificate are not collected yet."""
reason = """A declare-mode run whose declaration can never reach the certificate is \
refused instead of run: it would change the prompt and drop what the prompt asks for."""
profile_keys = [
    { profile = "paper/tb4", key = "declare.verifier_timeout_sec", upstream = 300.0 },
    { profile = "paper/tbsci", key = "declare.verifier_timeout_sec", upstream = 600.0 },
]

[[deviation]]
id = "D09"
title = "Intake refuses tasks the generic adapter packaged with settings dropped"
category = "affects-intake"
upstream = """judge/adapters/harbor_generic.py packaged any single-container task: it \
never copied tests/ or solution/, and its fixed task.toml dropped MCP servers \
and GPU requests."""
shipped = """paper/generic refuses a task that ships tests/ unless the run replaces \
them (strip_tests = false). paper/generic and gdpval refuse tasks that declare \
